#
# The port's checks, with no ROM: CI never has one, so nothing here can
# generate game code. Every build is engine-only (-DCT_ENGINE_ONLY=ON),
# and CT_ROM is unset in every step that runs CMake.
#
# The only artifacts uploaded are the engine install (dist-check) and, on
# tags, the engine AppImage, each uploaded only after tools/check_dist.py
# has passed on the exact file being uploaded (docs/PACKAGING.md).
#
# Upstream's ci.yml is left as it is; this file adds to it.
name: port

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: engine-only build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        # libsdl2-dev ships SDL2Config.cmake, so find_package(SDL2 CONFIG)
        # finds it and the tarball-headers fallback is not used.
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: env -u CT_ROM cmake -S . -B build -DCT_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build -LE rom --output-on-failure
      - name: No generated functions in the engine programs
        run: |
          status=0
          for exe in build/ct_sdl_engine build/ct_boot_engine; do
            test -x "$exe" || { echo "::error::$exe was not built"; status=1; continue; }
            n=$(nm "$exe" | grep -cE ' f_[0-9A-F]{6}_' || true)
            echo "$exe: $n generated symbols"
            if [ "$n" -ne 0 ]; then
              echo "::error::$exe contains generated functions"
              nm "$exe" | grep -E ' f_[0-9A-F]{6}_' | head -20
              status=1
            fi
          done
          exit $status

  # port: the engine on 64-bit Windows (MSYS2 UCRT64, MinGW-w64). Same
  # engine-only tree and ROM-free tests as `build`; no game, no ROM.
  windows:
    name: engine-only build and tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-git
      - name: Configure
        run: |
          unset CT_ROM
          cmake -S . -B build -G Ninja -DCT_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
      - name: Build
        run: cmake --build build -j "$(nproc)" -- -k 0   # every error at once, not the first
      - name: Test
        run: ctest --test-dir build -LE rom --output-on-failure

  lint:
    name: lint (game-agnostic, REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game words or symbols in the engine sources
        run: python3 tools/check_agnostic.py .
      - name: REUSE
        run: pipx run --spec reuse==6.3.0 reuse lint

  dist-check:
    name: install and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: |
          env -u CT_ROM cmake -S . -B build -DCT_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build the engine
        run: cmake --build build -j "$(nproc)" --target ct_sdl_engine
      - name: Install
        run: DESTDIR="$PWD/stage" cmake --install build
      - name: Pack
        run: tar -C stage -czf ct-recomp-engine-x86_64.tar.gz usr
      - name: check_dist (no ROM; the ROM-window check is skipped)
        run: python3 tools/check_dist.py --quiet stage ct-recomp-engine-x86_64.tar.gz
      - name: Upload the engine (only after check_dist passed)
        uses: actions/upload-artifact@v4
        with:
          name: ct-recomp-engine-x86_64
          path: ct-recomp-engine-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # EXPERIMENTAL Windows package: cross-built on Linux with zig
  # (packaging/windows/build.sh), uploaded only after check_dist passed on
  # the exact zip. No ROM, no generated code, no module in it.
  windows-package:
    name: Windows package (cross-build, check_dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build curl unzip
      - name: Build the package
        run: env -u CT_ROM CMAKE_GENERATOR=Ninja sh packaging/windows/build.sh "$PWD/build-win64"
      - name: check_dist (no ROM; the ROM-window check is skipped)
        run: python3 tools/check_dist.py --quiet build-win64/CT_Recomp-win64.zip
      - name: Upload the package (only after check_dist passed)
        uses: actions/upload-artifact@v4
        with:
          name: CT_Recomp-win64
          path: build-win64/CT_Recomp-win64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # The check that the package's own Python and the UNMODIFIED zig.exe work on
  # a real Windows machine: build the synthetic test module and load it with
  # the package's ct_boot_engine.exe. No ROM.
  windows-package-test:
    name: Windows package test (real Windows, unmodified zig)
    needs: [windows-package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CT_Recomp-win64
          path: dl
      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path dl\CT_Recomp-win64.zip -DestinationPath pkg
      - name: Build and load the synthetic module with the package's own tools
        shell: cmd
        run: packaging\windows\synth\ci-module.bat "%GITHUB_WORKSPACE%\pkg\CT_Recomp" "%GITHUB_WORKSPACE%\packaging\windows\synth"

  # NOT YET TESTED IN CI: packaging/appimage/build.sh has only been run on a
  # developer machine. It is allowed to fail until it has passed here.
  appimage:
    name: AppImage (tags only, not yet tested in CI)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, lint, dist-check]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # libsdl2-dev: the engine links the system SDL2 and build.sh bundles
        # it (SDL2=system); squashfs-tools: check_dist looks inside the image.
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev squashfs-tools
      - name: Build the AppImage
        run: env -u CT_ROM packaging/appimage/build.sh "$PWD/build-appimage"
      - name: check_dist (no ROM; the ROM-window check is skipped)
        run: python3 tools/check_dist.py --quiet build-appimage/CT_Recomp-x86_64.AppImage
      - name: Upload the AppImage (only after check_dist passed)
        uses: actions/upload-artifact@v4
        with:
          name: CT_Recomp-x86_64.AppImage
          path: build-appimage/CT_Recomp-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

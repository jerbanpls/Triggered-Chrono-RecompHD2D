#
# Engine-only Flatpak (docs/PACKAGING.md). Build it with
#
#   packaging/flatpak/build.sh
#
# which writes the engine's source (`git archive HEAD`) and runs
# flatpak-builder on this file.
#
# It holds no game code or data: the engine is built with CT_ENGINE_ONLY,
# from the committed sources only (`git archive HEAD`, so neither rom/ nor
# any build tree is ever copied in). On first use the user's own ROM is turned
# into a game module in ~/.var/app/io.github.jerbanpls.CtRecomp/data, with
# the runtime's python3 and the bundled zig.
app-id: io.github.jerbanpls.CtRecomp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ct-recomp
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  # controllers (evdev, hidraw) and the GPU
  - --device=all
  # reading the user's ROM
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  # port: screenshots (frontend/qol.h) in ~/Pictures/ct-recomp
  - --filesystem=xdg-pictures/ct-recomp:create
  # port: logind's PrepareForSleep, to save the resume point before a suspend
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: SDL2
    buildsystem: cmake-ninja
    # SDL refuses an in-tree build
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/aclocal
      - '*.a'
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
        sha256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165

  # zig (MIT), run as `zig cc` by /app/libexec/ct-recomp/zig-cc to compile
  # the game module on the user's machine.
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/zig
      - cp -a zig/. /app/lib/zig/
      - sh trim-zig.sh /app/lib/zig
      - install -Dm644 zig/LICENSE /app/share/licenses/ct-recomp/zig/LICENSE
    sources:
      - type: archive
        url: https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
        sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        dest: zig
        only-arches:
          - x86_64
      - type: file
        path: ../trim-zig.sh

  - name: ct-recomp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCT_ENGINE_ONLY=ON
      # SDL2 from the module above; never the header download
      - -DCT_SDL2_SYSTEM_LIB=OFF
      # the default --data-dir: the installed one, not the build's /run/build
      - -DCT_ENGINE_DATA_DIR=/app/share/ct-recomp
    post-install:
      # The compliance guarantee, checked on what was installed.
      # This runs before flatpak-builder strips the binary, so nm sees the
      # full symbol table. nm's output goes to a file first, so that nm
      # failing fails the build instead of passing the grep.
      - nm /app/bin/ct_sdl_engine > ../engine.syms
      - test -s ../engine.syms
      - "! grep -qE ' f_[0-9A-Fa-f]{6}' ../engine.syms"
      - test -z "$(find /app \( -name 'ct_game*' -o -iname '*.sfc' -o -iname '*.smc' -o -name 'ct_funcs.*' -o -name 'ct_overlays.*' -o -name 'bank*.c' \) -print)"
    sources:
      # `git archive HEAD`, unpacked by packaging/flatpak/build.sh:
      # committed files only, from the checkout's HEAD. A dir source, as
      # flatpak-builder caches a local archive by its path alone and would
      # reuse a stale build after a new commit; this module is rebuilt on
      # every run instead (SDL2 and zig stay cached).
      - type: dir
        path: ../../build-flatpak-src/ct-recomp

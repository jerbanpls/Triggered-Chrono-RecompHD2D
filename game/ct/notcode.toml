# Labels from the symbol sources (dscotton, ChronoRET) that are not function
# entries, so tools/progress.py leaves them out of the known-function count and
# tools/sync_symbols.py does not list them as unresolved. Kinds: interior,
# data, sentinel, padding, text (recomp/funcs.py load_notcode). test_notcode.py
# checks every `interior` entry is an instruction start of a compiled routine
# and that no entry is also a registered function or unresolved.
#
# interior: the label sits on an instruction the listed routine (`in`) already
# decodes and compiles by following its own branches; no JSR/JSL/JMP site or
# table outside that routine targets it (a call from compiled code would have
# made it an entry in funcs.toml). Nothing is added to compile.

